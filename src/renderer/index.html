<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GitPilot</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/" title="Retour au dashboard">
      <span class="brand-logo" id="brand-logo"></span>
      <span class="brand-name">GITPILOT</span>
    </a>
    <span class="topbar-sep"></span>
    <nav class="breadcrumb" id="breadcrumb" aria-label="Fil d'Ariane"></nav>
    <div class="topbar-right">
      <div class="user" id="user">
        <span class="avatar" id="user-avatar">?</span>
        <span class="user-name" id="user-name"></span>
      </div>
      <button class="icon-btn" id="btn-runs" title="Exécutions récentes" aria-label="Exécutions récentes">
        <span class="badge-dot hidden" id="runs-badge"></span>
      </button>
      <button class="icon-btn" id="btn-settings" title="Paramètres" aria-label="Paramètres"></button>
    </div>
  </header>

  <main class="content" id="view" tabindex="-1"></main>

  <div id="modal-root"></div>
  <div id="popover-root"></div>
  <div class="toasts" id="toast-root" aria-live="polite"></div>

  <script src="js/icons.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/state.js"></script>
  <script src="js/views/home.js"></script>
  <script src="js/views/project.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
